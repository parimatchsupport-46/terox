<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat · Chatter</title>
  <meta name="description" content="Chat page — conversation list, message thread and composer built with simple-ui components." />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/ui.css" />
  <link rel="stylesheet" href="assets/pages.css" />
</head>
<body>

  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </span>
        Chatter
      </a>

      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="chat.html" class="active" aria-current="page">Chat <span class="nav-count" data-nav-count hidden>0</span></a></li>
        <li><a href="profile.html">Profile</a></li>
      </ul>

      <div class="nav-actions">
        <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <a href="profile.html" class="nav-avatar avatar size-32 t-accent" data-nav-avatar aria-label="Open profile">RV</a>
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle menu" aria-expanded="false">
          <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="chat-page">
    <div class="chat-shell">
      <div class="chat-frame" id="chatFrame">

        <!-- ---------- sidebar ---------- -->
        <aside class="chat-side">
          <div class="side-top">
            <div class="side-title">
              <h2>Conversations</h2>
              <span class="badge badge-secondary" id="threadCount">0</span>
            </div>

            <!-- simple-ui ▸ Search Bar -->
            <div class="search-wrapper">
              <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input type="text" class="search-input" id="convSearch" placeholder="Search karo…" aria-label="Search conversations" autocomplete="off" />
            </div>
          </div>

          <div class="conv-list" id="convList" role="listbox" aria-label="Conversations"></div>
        </aside>

        <!-- ---------- thread ---------- -->
        <section class="chat-main">
          <header class="thread-head">
            <button class="icon-btn sm back-btn" id="backBtn" aria-label="Back to conversations">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
            </button>
            <span class="avatar size-40 t-accent" id="peerAvatar">MI</span>
            <div class="who">
              <b id="peerName">—</b>
              <span><span class="dot-status" id="peerDot"></span> <span id="peerMeta">select a conversation</span></span>
            </div>
            <div class="tooltip-wrapper">
              <button class="icon-btn sm" id="muteBtn" aria-label="Mute this conversation">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 1 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
              </button>
              <span class="tooltip-text">Mute notifications</span>
            </div>
            <div class="tooltip-wrapper">
              <button class="icon-btn sm" id="clearBtn" aria-label="Clear this thread">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
              </button>
              <span class="tooltip-text">Clear messages</span>
            </div>
          </header>

          <div class="messages" id="messages" aria-live="polite"></div>

          <footer class="composer">
            <div class="emoji-row" id="emojiRow" role="group" aria-label="Quick emoji"></div>

            <div class="composer-row">
              <div class="tooltip-wrapper">
                <button class="icon-btn" id="emojiBtn" aria-label="Insert emoji" aria-expanded="false">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>
                </button>
                <span class="tooltip-text">Emoji</span>
              </div>

              <textarea class="composer-input" id="composerInput" rows="1" placeholder="Message…" aria-label="Message input"></textarea>

              <div class="tooltip-wrapper">
                <button class="icon-btn" id="pinBtn" aria-label="Attach a file">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.4 11.05 12.3 20.2a5.5 5.5 0 0 1-7.8-7.8l9.1-9.1a3.7 3.7 0 0 1 5.2 5.2l-9.1 9.1a1.8 1.8 0 0 1-2.6-2.6l8.5-8.4"/></svg>
                </button>
                <span class="tooltip-text">Attach file</span>
              </div>

              <button class="btn" id="sendBtn" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4 20-7Z"/></svg>
                Send
              </button>
            </div>

            <div class="composer-hint">
              <span id="composerHint">Enter bhejta hai · Shift + Enter new line</span>
              <span class="badge badge-secondary" id="typingBadge" hidden>typing…</span>
            </div>
          </footer>
        </section>

      </div>
    </div>
  </main>

  <script src="assets/store.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/chat.js"></script>
</body>
</html>
