<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f7" id="themeColor" />
  <meta name="description" content="Terox Chat — all your contacts in one list. Tap to open a chat." />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <title>Terox Chat</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
  <link rel="stylesheet" href="assets/ui.css" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="app">

    <header class="appbar">
      <span class="brand">
<img class="logo-img" src="assets/logo.png" alt="Terox Chat logo" width="30" height="30" />
        Terox Chat
      </span>
      <div class="appbar-actions">
        <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Toggle dark theme">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <button class="icon-btn solid" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          <span class="pill" data-unread-pill hidden>0</span>
        </button>
      </div>
    </header>

    <div class="body">
      <div class="listbar">
        <div class="hint">
          <h1>All users</h1>
          <span><b data-online>0</b> online</span>
        </div>
        <div class="search">
          <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="search" id="userSearch" placeholder="Search name or message" aria-label="Search users" autocomplete="off" enterkeyhint="search" />
          <button class="s-clear" id="searchClear" aria-label="Clear search" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
      </div>

      <div class="ulist" id="userList" role="list"></div>
    </div>
  </div>

  <!-- ===== menu drawer: button on the right, panel opens from the left ===== -->
  <button class="scrim" id="scrim" hidden aria-hidden="true" tabindex="-1"></button>
  <aside class="drawer" id="drawer" aria-label="Menu" aria-hidden="true">
    <div class="drawer-head">
      <a class="avatar s48 t-accent" href="profile.html" data-davatar>RV<span class="live"></span></a>
      <div class="who">
        <b data-dname>Terox Chat</b>
        <span data-dhandle>@terox</span>
      </div>
      <button class="icon-btn" id="drawerClose" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav>
      <a href="index.html" data-nav="home" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>
        Home
      </a>
      <a href="chat.html" data-nav="chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat
        <span class="badge-count" data-unread-pill hidden>0</span>
      </a>
      <a href="profile.html" data-nav="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
    </nav>
    <div class="drawer-foot">
      <div class="rowline">
        <span class="tl">Dark theme</span>
        <label class="switch">
          <input type="checkbox" id="darkSwitch" />
          <span class="sl"></span>
        </label>
      </div>
      <p class="ver"><img class="ver-logo" src="assets/logo.png" alt="" width="16" height="16" /> Terox Chat · v1.0 · mobile only</p>
    </div>
  </aside>

  <script src="assets/auth.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>
