<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f5f7" id="themeColor" />
  <meta name="description" content="Terox Chat — conversation with tap-to-open message actions: reply, copy, edit, delete." />
  <meta name="format-detection" content="telephone=no" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo-32.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <title>Chat · Terox Chat</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "light"); }
    })();
  </script>
  <link rel="stylesheet" href="assets/ui.css" />
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body>
  <div class="app full">

    <header class="appbar">
      <a class="icon-btn" href="index.html" aria-label="Back to all users">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
      </a>
      <a class="peer-link" id="peerProfile" href="user.html" aria-label="View this profile">
        <span class="avatar s40 t-accent" id="peerAvatar"><span>?</span></span>
        <span class="titles">
          <b id="peerName">Loading…</b>
          <span><span class="dot-status online"></span> <span id="peerStatus">Online</span></span>
        </span>
      </a>
      <div class="appbar-actions">
        <button class="icon-btn solid" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="drawer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          <span class="pill" data-unread-pill hidden>0</span>
        </button>
      </div>
    </header>

    <div class="body" style="display:flex;flex-direction:column;min-height:0">
      <div class="thread" id="thread" aria-live="polite"></div>
      <div class="typingbar" id="typingBar" hidden>
        <span class="spinner-dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
        <span id="typingWho">typing…</span>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <div class="ctx" id="ctxReply" hidden>
          <span class="k">Reply to <b id="replyWho">—</b></span>
          <span class="muted" id="replyText" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
          <span class="x"><button class="cx" type="button" id="replyCancel" aria-label="Cancel reply">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button></span>
        </div>

        <div class="ctx edit" id="ctxEdit" hidden>
          <span class="k">Editing message</span>
          <span class="x" style="margin-left:auto"><button class="cx" type="button" id="editCancel" aria-label="Cancel edit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button></span>
        </div>

        <div class="emoji" id="emojiRow" role="group" aria-label="Quick emoji"></div>

        <div class="crow">
          <button class="icon-btn" type="button" id="emojiBtn" aria-label="Insert emoji" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4 4 0 0 0 7 0M9 9.5h.01M15 9.5h.01"/></svg>
          </button>
          <textarea id="input" rows="1" placeholder="Message" aria-label="Message" enterkeyhint="send" autocapitalize="sentences"></textarea>
          <button class="send" type="submit" id="sendBtn" disabled aria-label="Send message">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4 20-7Z"/></svg>
          </button>
        </div>

        <div class="chelp">
          <span id="hint">Tap a message to reply, copy, edit or delete</span>
          <span id="counter" hidden>0/4000</span>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== message action sheet ===== -->
  <button class="scrim" id="sheetScrim" hidden aria-hidden="true" tabindex="-1"></button>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Message actions">
    <div class="grab"></div>
    <div class="sheet-msg">
      <p class="txt" id="sheetText">—</p>
      <div class="stamp">
        <span class="badge badge-secondary" id="sheetDate">—</span>
        <span class="badge badge-secondary" id="sheetTime">—</span>
        <span class="badge badge-secondary" id="sheetFrom">—</span>
        <span class="badge badge-secondary" id="sheetEdited" hidden>Edited</span>
      </div>
    </div>
    <div class="sheet-actions">
      <button type="button" data-act="reply">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v4"/></svg>
        Reply
      </button>
      <button type="button" data-act="copy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy
      </button>
      <button type="button" data-act="edit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        Edit
      </button>
      <button type="button" data-act="delete" class="danger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
        Delete
      </button>
    </div>
    <div class="sheet-foot">
      <button class="btn ghost block sm" type="button" id="sheetClose">Close</button>
    </div>
  </div>

  <!-- ===== menu drawer: button on the right, panel opens from the left ===== -->
  <button class="scrim" id="scrim" hidden aria-hidden="true" tabindex="-1"></button>
  <aside class="drawer" id="drawer" aria-label="Menu" aria-hidden="true">
    <div class="drawer-head">
      <a class="avatar s48 t-accent" href="profile.html" data-davatar>RV<span class="live"></span></a>
      <div class="who">
        <b data-dname>Terox Chat</b>
        <span data-dhandle>@terox</span>
      </div>
      <button class="icon-btn" id="drawerClose" aria-label="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <nav>
      <a href="index.html" data-nav="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg>
        Home
      </a>
      <a href="chat.html" data-nav="chat" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat
        <span class="badge-count" data-unread-pill hidden>0</span>
      </a>
      <a href="profile.html" data-nav="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
    </nav>
    <div class="drawer-foot">
      <p class="ver"><img class="ver-logo" src="assets/logo.png" alt="" width="16" height="16" /> Terox Chat · v1.0 · mobile only</p>
    </div>
  </aside>

  <script src="assets/auth.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/ui.js"></script>
  <script src="assets/chat.js"></script>
</body>
</html>
